# Publishes web/ on GitHub Pages at every push to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip an unconfigured app
        id: check
        run: |
          if grep -q 'example.com\|<project-id>' web/config.js; then
            echo "::warning::web/config.js still has the example values: fill tn.config.json, run 'node tools/configure.mjs', commit. Nothing published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - if: steps.check.outputs.ok == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
